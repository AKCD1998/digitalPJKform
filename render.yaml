services:
  - type: web
    name: digitalpjkform
    runtime: node
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci
    startCommand: npm run start --workspace backend
    envVars:
      - key: DIGITALPJK_DATABASE_URL
        sync: false
      - key: DIGITALPJK_JWT_SECRET
        generateValue: true
      - key: DIGITALPJK_JWT_EXPIRES_IN
        value: "1h"
      - key: DIGITALPJK_CEO_NAME_TH
        value: "ทรงพล ลิ้มพิสูจน์"
      - key: CORS_ORIGIN
        value: "https://digitalpjkformsite.onrender.com"
      - key: DIGITALPJK_LOGIN_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: DIGITALPJK_LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: DIGITALPJK_PDF_WRITE_SAMPLE
        value: "false"
      - key: DIGITALPJK_PDF_SAMPLE_DIR
        value: ""

  - type: web
    name: digitalpjkformsite
    runtime: static
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_DIGITALPJK_API_BASE_URL
        value: "https://sc-official-website.onrender.com"
      - key: VITE_DIGITALPJK_API_PREFIX
        value: "/api/digitalpjk"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
